<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Lexical-overlap classification blobs</title>
  <desc id="desc">Validation examples are grouped into low, mid, and high lexical-overlap buckets using pair-specific q33 and q67 thresholds.</desc>
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #4a5568; }
      .label { font: 700 17px Arial, sans-serif; fill: #17202a; }
      .small { font: 13px Arial, sans-serif; fill: #4a5568; }
      .tiny { font: 12px Arial, sans-serif; fill: #4a5568; }
      .axis { stroke: #54606d; stroke-width: 2; marker-end: url(#arrow); }
      .threshold { stroke: #5f6b7a; stroke-width: 2; stroke-dasharray: 7 7; }
      .blob-low { fill: #f06f78; fill-opacity: 0.18; stroke: #d44d59; stroke-width: 2; }
      .blob-mid { fill: #f2b84b; fill-opacity: 0.20; stroke: #c98a15; stroke-width: 2; }
      .blob-high { fill: #42b883; fill-opacity: 0.20; stroke: #228a5b; stroke-width: 2; }
      .dot-low { fill: #d44d59; opacity: 0.76; }
      .dot-mid { fill: #c98a15; opacity: 0.76; }
      .dot-high { fill: #228a5b; opacity: 0.76; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 1.4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#54606d" />
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="470" fill="#fbfcfe" />
  <text x="40" y="48" class="title">How validation rows are classified</text>
  <text x="40" y="76" class="subtitle">Each row is placed into an overlap bucket before retrieval scores are compared.</text>

  <line x1="90" y1="380" x2="890" y2="380" class="axis" />
  <text x="92" y="410" class="small">lower lexical overlap</text>
  <text x="735" y="410" class="small">higher lexical overlap</text>

  <line x1="350" y1="120" x2="350" y2="388" class="threshold" />
  <line x1="628" y1="120" x2="628" y2="388" class="threshold" />
  <text x="322" y="111" class="tiny">q33</text>
  <text x="600" y="111" class="tiny">q67</text>

  <ellipse cx="215" cy="247" rx="148" ry="102" class="blob-low" />
  <ellipse cx="489" cy="247" rx="148" ry="102" class="blob-mid" />
  <ellipse cx="765" cy="247" rx="148" ry="102" class="blob-high" />

  <text x="172" y="168" class="label">Low overlap</text>
  <text x="172" y="190" class="small">3,300 rows</text>
  <text x="150" y="318" class="small">bottom third per idiom pair</text>

  <text x="443" y="168" class="label">Mid overlap</text>
  <text x="443" y="190" class="small">3,398 rows</text>
  <text x="429" y="318" class="small">middle third per idiom pair</text>

  <text x="716" y="168" class="label">High overlap</text>
  <text x="716" y="190" class="small">3,302 rows</text>
  <text x="698" y="318" class="small">top third per idiom pair</text>

  <g>
    <circle cx="159" cy="230" r="8" class="dot-low" />
    <circle cx="181" cy="258" r="7" class="dot-low" />
    <circle cx="203" cy="218" r="10" class="dot-low" />
    <circle cx="225" cy="277" r="8" class="dot-low" />
    <circle cx="248" cy="238" r="9" class="dot-low" />
    <circle cx="273" cy="264" r="7" class="dot-low" />
    <circle cx="134" cy="272" r="6" class="dot-low" />
    <circle cx="234" cy="205" r="6" class="dot-low" />
    <circle cx="191" cy="291" r="7" class="dot-low" />
    <circle cx="285" cy="221" r="8" class="dot-low" />

    <circle cx="431" cy="233" r="8" class="dot-mid" />
    <circle cx="457" cy="260" r="7" class="dot-mid" />
    <circle cx="482" cy="222" r="10" class="dot-mid" />
    <circle cx="507" cy="278" r="8" class="dot-mid" />
    <circle cx="531" cy="239" r="9" class="dot-mid" />
    <circle cx="556" cy="265" r="7" class="dot-mid" />
    <circle cx="410" cy="270" r="6" class="dot-mid" />
    <circle cx="513" cy="205" r="6" class="dot-mid" />
    <circle cx="472" cy="291" r="7" class="dot-mid" />
    <circle cx="569" cy="222" r="8" class="dot-mid" />

    <circle cx="707" cy="231" r="8" class="dot-high" />
    <circle cx="732" cy="259" r="7" class="dot-high" />
    <circle cx="758" cy="220" r="10" class="dot-high" />
    <circle cx="783" cy="277" r="8" class="dot-high" />
    <circle cx="807" cy="238" r="9" class="dot-high" />
    <circle cx="832" cy="264" r="7" class="dot-high" />
    <circle cx="686" cy="271" r="6" class="dot-high" />
    <circle cx="789" cy="204" r="6" class="dot-high" />
    <circle cx="748" cy="291" r="7" class="dot-high" />
    <circle cx="845" cy="222" r="8" class="dot-high" />
  </g>

  <rect x="40" y="430" width="900" height="1" fill="#d8dee8" />
  <text x="40" y="454" class="tiny">Classification rule: character 3-5 gram Jaccard overlap, bucketed by q33 and q67 within each source-target idiom direction.</text>
</svg>
